services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: segcheck_test
      POSTGRES_USER: segcheck
      POSTGRES_PASSWORD: segcheck
    ports:
      - "55432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ../supabase_migration_corrected_masks.sql:/tests/supabase_migration_corrected_masks.sql:ro
      - ./apply_staging_updates.sql:/tests/apply_staging_updates.sql:ro
      - ./partial_redo_test.sql:/tests/partial_redo_test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U segcheck -d segcheck_test"]
      interval: 2s
      timeout: 5s
      retries: 15
